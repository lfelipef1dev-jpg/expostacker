<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#16161a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8AB4F8"/>
      <stop offset="100%" stop-color="#AECBFA"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#FFD700" stroke-width="1">
    <line x1="0" y1="78" x2="1200" y2="78"/>
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="236" x2="1200" y2="236"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="394" x2="1200" y2="394"/>
    <line x1="0" y1="473" x2="1200" y2="473"/>
    <line x1="0" y1="552" x2="1200" y2="552"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Tiger icon (simplified) -->
  <g transform="translate(80, 120)" filter="url(#goldGlow)">
    <!-- Tiger head circle -->
    <circle cx="60" cy="60" r="50" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <!-- Tiger ears -->
    <path d="M 25 30 L 35 15 L 45 30 Z" fill="url(#gold)" opacity="0.8"/>
    <path d="M 75 30 L 85 15 L 95 30 Z" fill="url(#gold)" opacity="0.8"/>
    <!-- Tiger eyes -->
    <circle cx="45" cy="55" r="4" fill="#FFD700"/>
    <circle cx="75" cy="55" r="4" fill="#FFD700"/>
    <!-- Tiger nose -->
    <path d="M 55 70 L 60 75 L 65 70 Z" fill="url(#gold)"/>
    <!-- Tiger stripes -->
    <line x1="30" y1="45" x2="35" y2="50" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <line x1="90" y1="45" x2="85" y2="50" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="65" x2="28" y2="68" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="65" x2="92" y2="68" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="80" y="280" font-family="'Space Grotesk', sans-serif" font-size="56" font-weight="900" fill="#E6E6E6" letter-spacing="-2">
    TigreBet
  </text>
  <text x="80" y="320" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="rgba(230,230,230,0.70)">
    Plataforma de jogos online · 11 jogos · PIX · VIP
  </text>

  <!-- Tech badges -->
  <g transform="translate(80, 360)">
    <rect x="0" y="0" width="110" height="32" rx="16" fill="rgba(255,215,0,0.10)" stroke="rgba(255,215,0,0.30)" stroke-width="1"/>
    <text x="55" y="21" font-family="'JetBrains Mono', monospace" font-size="13" fill="#FFD700" text-anchor="middle">Next.js 14</text>

    <rect x="120" y="0" width="90" height="32" rx="16" fill="rgba(138,180,248,0.10)" stroke="rgba(138,180,248,0.30)" stroke-width="1"/>
    <text x="165" y="21" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8AB4F8" text-anchor="middle">Express</text>

    <rect x="220" y="0" width="120" height="32" rx="16" fill="rgba(255,215,0,0.10)" stroke="rgba(255,215,0,0.30)" stroke-width="1"/>
    <text x="280" y="21" font-family="'JetBrains Mono', monospace" font-size="13" fill="#FFD700" text-anchor="middle">PostgreSQL</text>

    <rect x="350" y="0" width="80" height="32" rx="16" fill="rgba(138,180,248,0.10)" stroke="rgba(138,180,248,0.30)" stroke-width="1"/>
    <text x="390" y="21" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8AB4F8" text-anchor="middle">Redis</text>

    <rect x="440" y="0" width="130" height="32" rx="16" fill="rgba(255,215,0,0.10)" stroke="rgba(255,215,0,0.30)" stroke-width="1"/>
    <text x="505" y="21" font-family="'JetBrains Mono', monospace" font-size="13" fill="#FFD700" text-anchor="middle">Mercado Pago</text>
  </g>

  <!-- Game cards preview (right side) -->
  <g transform="translate(680, 100)">
    <!-- Card 1: Fortune Tiger -->
    <rect x="0" y="0" width="200" height="120" rx="12" fill="#1a1a1a" stroke="rgba(255,215,0,0.25)" stroke-width="1"/>
    <rect x="0" y="0" width="200" height="4" rx="2" fill="url(#gold)"/>
    <text x="100" y="50" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#FFD700" text-anchor="middle">Fortune Tiger</text>
    <text x="100" y="75" font-family="'Inter', sans-serif" font-size="12" fill="rgba(230,230,230,0.60)" text-anchor="middle">Slot principal</text>
    <rect x="60" y="90" width="80" height="20" rx="10" fill="rgba(255,215,0,0.15)"/>
    <text x="100" y="104" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFD700" text-anchor="middle">Provably Fair</text>

    <!-- Card 2: Crash -->
    <rect x="220" y="0" width="200" height="120" rx="12" fill="#1a1a1a" stroke="rgba(138,180,248,0.25)" stroke-width="1"/>
    <rect x="220" y="0" width="200" height="4" rx="2" fill="url(#accent)"/>
    <text x="320" y="50" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#8AB4F8" text-anchor="middle">Crash</text>
    <text x="320" y="75" font-family="'Inter', sans-serif" font-size="12" fill="rgba(230,230,230,0.60)" text-anchor="middle">Multiplicador</text>
    <rect x="280" y="90" width="80" height="20" rx="10" fill="rgba(138,180,248,0.15)"/>
    <text x="320" y="104" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8AB4F8" text-anchor="middle">RNG seguro</text>

    <!-- Card 3: Plinko -->
    <rect x="0" y="140" width="200" height="120" rx="12" fill="#1a1a1a" stroke="rgba(255,215,0,0.25)" stroke-width="1"/>
    <rect x="0" y="140" width="200" height="4" rx="2" fill="url(#gold)"/>
    <text x="100" y="190" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#FFD700" text-anchor="middle">Plinko</text>
    <text x="100" y="215" font-family="'Inter', sans-serif" font-size="12" fill="rgba(230,230,230,0.60)" text-anchor="middle">Bola caindo</text>
    <rect x="60" y="230" width="80" height="20" rx="10" fill="rgba(255,215,0,0.15)"/>
    <text x="100" y="244" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFD700" text-anchor="middle">Canvas</text>

    <!-- Card 4: Double -->
    <rect x="220" y="140" width="200" height="120" rx="12" fill="#1a1a1a" stroke="rgba(138,180,248,0.25)" stroke-width="1"/>
    <rect x="220" y="140" width="200" height="4" rx="2" fill="url(#accent)"/>
    <text x="320" y="190" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#8AB4F8" text-anchor="middle">Double</text>
    <text x="320" y="215" font-family="'Inter', sans-serif" font-size="12" fill="rgba(230,230,230,0.60)" text-anchor="middle">Roleta</text>
    <rect x="280" y="230" width="80" height="20" rx="10" fill="rgba(138,180,248,0.15)"/>
    <text x="320" y="244" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8AB4F8" text-anchor="middle">Polling 600ms</text>

    <!-- Card 5: Mines -->
    <rect x="0" y="280" width="200" height="120" rx="12" fill="#1a1a1a" stroke="rgba(255,215,0,0.25)" stroke-width="1"/>
    <rect x="0" y="280" width="200" height="4" rx="2" fill="url(#gold)"/>
    <text x="100" y="330" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#FFD700" text-anchor="middle">Mines</text>
    <text x="100" y="355" font-family="'Inter', sans-serif" font-size="12" fill="rgba(230,230,230,0.60)" text-anchor="middle">Campo minado</text>
    <rect x="60" y="370" width="80" height="20" rx="10" fill="rgba(255,215,0,0.15)"/>
    <text x="100" y="384" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFD700" text-anchor="middle">Redis session</text>

    <!-- Card 6: Wingo -->
    <rect x="220" y="280" width="200" height="120" rx="12" fill="#1a1a1a" stroke="rgba(138,180,248,0.25)" stroke-width="1"/>
    <rect x="220" y="280" width="200" height="4" rx="2" fill="url(#accent)"/>
    <text x="320" y="330" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#8AB4F8" text-anchor="middle">Wingo</text>
    <text x="320" y="355" font-family="'Inter', sans-serif" font-size="12" fill="rgba(230,230,230,0.60)" text-anchor="middle">Loteria</text>
    <rect x="280" y="370" width="80" height="20" rx="10" fill="rgba(138,180,248,0.15)"/>
    <text x="320" y="384" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8AB4F8" text-anchor="middle">Trend data</text>
  </g>

  <!-- Metrics bar at bottom -->
  <g transform="translate(80, 540)">
    <line x1="0" y1="0" x2="520" y2="0" stroke="rgba(255,215,0,0.20)" stroke-width="1"/>
    <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" fill="#FFD700">11</text>
    <text x="0" y="55" font-family="'Inter', sans-serif" font-size="12" fill="rgba(230,230,230,0.60)">Jogos</text>

    <text x="130" y="30" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" fill="#8AB4F8">50+</text>
    <text x="130" y="55" font-family="'Inter', sans-serif" font-size="12" fill="rgba(230,230,230,0.60)">Rotas de API</text>

    <text x="290" y="30" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" fill="#FFD700">10</text>
    <text x="290" y="55" font-family="'Inter', sans-serif" font-size="12" fill="rgba(230,230,230,0.60)">Tabelas PG</text>

    <text x="420" y="30" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" fill="#8AB4F8">5</text>
    <text x="420" y="55" font-family="'Inter', sans-serif" font-size="12" fill="rgba(230,230,230,0.60)">Niveis VIP</text>
  </g>
</svg>
