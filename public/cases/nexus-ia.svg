<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#16161a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8AB4F8"/>
      <stop offset="100%" stop-color="#AECBFA"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8AB4F8"/>
      <stop offset="100%" stop-color="#4F8EF7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#8AB4F8" stroke-width="1">
    <line x1="0" y1="78" x2="1200" y2="78"/>
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="236" x2="1200" y2="236"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="394" x2="1200" y2="394"/>
    <line x1="0" y1="473" x2="1200" y2="473"/>
    <line x1="0" y1="552" x2="1200" y2="552"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Nexus node icon (left) -->
  <g transform="translate(80, 110)" filter="url(#glow)">
    <!-- Central node -->
    <circle cx="60" cy="60" r="22" fill="url(#accent2)" opacity="0.9"/>
    <!-- Outer nodes -->
    <circle cx="15" cy="20" r="10" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="105" cy="20" r="10" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="15" cy="100" r="10" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="105" cy="100" r="10" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <!-- Connections -->
    <line x1="22" y1="26" x2="44" y2="50" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="98" y1="26" x2="76" y2="50" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="22" y1="94" x2="44" y2="70" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="98" y1="94" x2="76" y2="70" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Title -->
  <text x="80" y="280" font-family="'Space Grotesk', sans-serif" font-size="56" font-weight="900" fill="#E6E6E6" letter-spacing="-2">
    Nexus IA
  </text>
  <text x="80" y="320" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="rgba(230,230,230,0.70)">
    SaaS de IA · Roteamento inteligente · Workspace autônomo
  </text>

  <!-- Tech badges -->
  <g transform="translate(80, 360)">
    <rect x="0" y="0" width="90" height="32" rx="16" fill="rgba(138,180,248,0.10)" stroke="rgba(138,180,248,0.30)" stroke-width="1"/>
    <text x="45" y="21" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8AB4F8" text-anchor="middle">FastAPI</text>

    <rect x="100" y="0" width="80" height="32" rx="16" fill="rgba(138,180,248,0.10)" stroke="rgba(138,180,248,0.30)" stroke-width="1"/>
    <text x="140" y="21" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8AB4F8" text-anchor="middle">React</text>

    <rect x="190" y="0" width="90" height="32" rx="16" fill="rgba(138,180,248,0.10)" stroke="rgba(138,180,248,0.30)" stroke-width="1"/>
    <text x="235" y="21" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8AB4F8" text-anchor="middle">Python</text>

    <rect x="290" y="0" width="90" height="32" rx="16" fill="rgba(138,180,248,0.10)" stroke="rgba(138,180,248,0.30)" stroke-width="1"/>
    <text x="335" y="21" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8AB4F8" text-anchor="middle">Groq</text>

    <rect x="390" y="0" width="110" height="32" rx="16" fill="rgba(138,180,248,0.10)" stroke="rgba(138,180,248,0.30)" stroke-width="1"/>
    <text x="445" y="21" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8AB4F8" text-anchor="middle">Cerebras</text>

    <rect x="510" y="0" width="100" height="32" rx="16" fill="rgba(138,180,248,0.10)" stroke="rgba(138,180,248,0.30)" stroke-width="1"/>
    <text x="560" y="21" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8AB4F8" text-anchor="middle">Gemini</text>
  </g>

  <!-- Chat/workspace preview (right side) -->
  <g transform="translate(680, 100)">
    <!-- Panel frame -->
    <rect x="0" y="0" width="440" height="430" rx="14" fill="#1a1a1a" stroke="rgba(138,180,248,0.25)" stroke-width="1"/>
    <rect x="0" y="0" width="440" height="4" rx="2" fill="url(#accent)"/>

    <!-- Header bar -->
    <rect x="0" y="4" width="440" height="36" fill="#16161a"/>
    <circle cx="20" cy="22" r="4" fill="#8AB4F8"/>
    <text x="34" y="27" font-family="'JetBrains Mono', monospace" font-size="12" fill="rgba(230,230,230,0.70)">nexus-auto</text>
    <rect x="360" y="14" width="64" height="18" rx="9" fill="rgba(138,180,248,0.15)"/>
    <text x="392" y="27" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8AB4F8" text-anchor="middle">online</text>

    <!-- Chat messages -->
    <rect x="20" y="56" width="240" height="44" rx="10" fill="#252525"/>
    <text x="32" y="76" font-family="'Inter', sans-serif" font-size="12" fill="#E6E6E6">Explique roteamento entre</text>
    <text x="32" y="92" font-family="'Inter', sans-serif" font-size="12" fill="#E6E6E6">Groq e Cerebras</text>

    <rect x="160" y="112" width="260" height="60" rx="10" fill="rgba(138,180,248,0.12)" stroke="rgba(138,180,248,0.25)" stroke-width="1"/>
    <text x="172" y="132" font-family="'Inter', sans-serif" font-size="12" fill="#E6E6E6">O Auto escolhe o provedor</text>
    <text x="172" y="148" font-family="'Inter', sans-serif" font-size="12" fill="#E6E6E6">por latência e contexto.</text>
    <text x="172" y="164" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8AB4F8">Groq · 180ms</text>

    <rect x="20" y="184" width="200" height="44" rx="10" fill="#252525"/>
    <text x="32" y="204" font-family="'Inter', sans-serif" font-size="12" fill="#E6E6E6">Gere o endpoint de</text>
    <text x="32" y="220" font-family="'Inter', sans-serif" font-size="12" fill="#E6E6E6">chat streaming</text>

    <!-- Code block -->
    <rect x="160" y="240" width="260" height="80" rx="10" fill="#0d0d0d" stroke="rgba(138,180,248,0.20)" stroke-width="1"/>
    <text x="172" y="260" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8AB4F8">@app.post("/chat")</text>
    <text x="172" y="276" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(230,230,230,0.70)">async def chat(req):</text>
    <text x="172" y="292" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(230,230,230,0.70)">  return StreamingResponse(</text>
    <text x="172" y="308" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8AB4F8">    route(req))</text>

    <!-- Input bar -->
    <rect x="20" y="370" width="400" height="40" rx="20" fill="#252525" stroke="rgba(138,180,248,0.20)" stroke-width="1"/>
    <text x="36" y="395" font-family="'Inter', sans-serif" font-size="12" fill="rgba(230,230,230,0.40)">Pergunte ao Nexus...</text>
    <circle cx="396" cy="390" r="14" fill="url(#accent2)"/>
    <path d="M 390 390 L 396 384 L 396 396 Z" fill="#0a0a0c"/>
  </g>

  <!-- Metrics bar at bottom -->
  <g transform="translate(80, 540)">
    <line x1="0" y1="0" x2="520" y2="0" stroke="rgba(138,180,248,0.20)" stroke-width="1"/>
    <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" fill="#8AB4F8">5</text>
    <text x="0" y="55" font-family="'Inter', sans-serif" font-size="12" fill="rgba(230,230,230,0.60)">Modelos</text>

    <text x="130" y="30" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" fill="#8AB4F8">3</text>
    <text x="130" y="55" font-family="'Inter', sans-serif" font-size="12" fill="rgba(230,230,230,0.60)">Provedores</text>

    <text x="290" y="30" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" fill="#8AB4F8">9</text>
    <text x="290" y="55" font-family="'Inter', sans-serif" font-size="12" fill="rgba(230,230,230,0.60)">Chaves API</text>

    <text x="420" y="30" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" fill="#8AB4F8">1</text>
    <text x="420" y="55" font-family="'Inter', sans-serif" font-size="12" fill="rgba(230,230,230,0.60)">Workspace</text>
  </g>
</svg>
